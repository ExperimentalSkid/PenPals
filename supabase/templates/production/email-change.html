<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your email change — Pen-Pals</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f7f5ef;color:#073A73;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f5ef;">
      <tr><td align="center" style="padding:38px 18px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;">
          <tr><td align="center" style="padding:0 0 22px;"><img src="{{ .SiteURL }}/assets/brand/logo/logo-primary.png" width="176" alt="pen-pals.net" style="display:block;width:176px;max-width:100%;height:auto;border:0;"></td></tr>
          <tr><td><div style="height:1px;background:#60A4E1;opacity:.55;"></div></td></tr>
          <tr><td style="padding:24px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fffdf7;border:1px solid #e2ddd1;border-radius:18px;">
              <tr><td style="padding:32px 28px;">
                <h1 style="margin:0 0 18px;color:#073A73;font-size:28px;line-height:1.22;">Confirm your email change</h1>
                <p style="margin:0;color:#455064;font-size:16px;line-height:1.65;">Confirm the change of your Pen-Pals email address to <strong style="word-break:break-all;">{{ .NewEmail }}</strong>.</p>

                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:26px"><tr><td bgcolor="#073A73" style="border-radius:8px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 20px;color:#ffffff;font-size:15px;font-weight:700;line-height:1.4;text-decoration:none;">Confirm email change</a></td></tr></table>
              </td></tr>
            </table>
          </td></tr>
          <tr><td style="padding:0 6px;color:#6c7280;font-size:12px;line-height:1.6;"><p style="margin:0;">If you didn't request this change, don't confirm it.</p><p style="margin:14px 0 0;color:#073A73;font-weight:700;">pen-pals.net</p></td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
